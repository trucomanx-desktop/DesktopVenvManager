[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop_venv_manager"
version = "0.1.4"
description = "A local Linux desktop application for creating, importing, inspecting, and managing Python `venv` environments."
readme = "README.md"
authors = [{name = "Fernando Pujaico Rivera", email = "fernando.pujaico.rivera@gmail.com"}]
maintainers = [{name = "Fernando Pujaico Rivera", email = "fernando.pujaico.rivera@gmail.com"}]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-only WITH Classpath-Exception-2.0 OR BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["environment", "manager"]
dependencies = [
    "PyQt5"
]

[project.urls]
"Bug Reports" = "https://github.com/trucomanx-desktop/DesktopVenvManager/issues"
"Funding" = "https://trucomanx.github.io/en/funding.html"
"Documentation" = "https://github.com/trucomanx-desktop/DesktopVenvManager/tree/main/doc"
"Source" = "https://github.com/trucomanx-desktop/DesktopVenvManager"

[project.scripts]
"desktop-venv-manager" = "desktop_venv_manager.program:main"

[tool.setuptools]
packages = ["desktop_venv_manager", "desktop_venv_manager.modules"]

[tool.setuptools.package-data]
"desktop_venv_manager" = ["icons/*.svg","icons/*.png"]
